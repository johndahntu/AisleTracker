<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aisle Tracker - Task Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000000;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .task-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s;
        }

        .task-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .task-item.new-item {
            border-left-color: #28a745;
        }

        .task-item.missing-price {
            border-left-color: #ffc107;
        }

        .task-item.audit {
            border-left-color: #17a2b8;
        }

        .task-item.subscription {
            border-left-color: #6f42c1;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .task-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #333;
        }

        .task-type {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .type-new-item {
            background: #d4edda;
            color: #155724;
        }

        .type-missing-price {
            background: #fff3cd;
            color: #856404;
        }

        .type-audit {
            background: #d1ecf1;
            color: #0c5460;
        }

        .type-subscription {
            background: #e2d9f3;
            color: #4a148c;
        }

        .task-details {
            color: #666;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-size: 0.85rem;
            color: #888;
        }

        .task-actions {
            display: flex;
            gap: 10px;
        }

        .task-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-complete {
            background: #28a745;
            color: white;
        }

        .btn-complete:hover {
            background: #218838;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .filters {
                justify-content: center;
            }
        }

        .days-remaining {
            font-weight: 600;
        }

        .days-warning {
            color: #dc3545;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-option input[type="radio"] {
            width: auto;
            margin: 0;
        }

        .radio-option label {
            margin: 0;
            font-weight: normal;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .subscription-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .subscription-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .subscription-tag {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subscription-tag button {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            padding: 0;
        }

        .subscription-tag button:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .just4u-badge {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 8px;
        }

        .task-image {
            margin-top: 10px;
            border-radius: 8px;
            max-width: 100%;
            max-height: 300px;
            object-fit: cover;
            cursor: pointer;
        }

        .image-preview {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛒 Aisle Tracker</h1>
            <p>Task & Issue Management System</p>
        </header>

        <div class="main-content">
            <div class="card">
                <h2>📝 Report New Task</h2>
                <form id="task-form">
                    <div class="form-group">
                        <label for="task-type">Task Type</label>
                        <select id="task-type" required>
                            <option value="">Select type...</option>
                            <option value="new-item">New Item Added</option>
                            <option value="missing-price">Missing Price Tag</option>
                            <option value="audit">Audit</option>
                            <option value="subscription">Subscription Required</option>
                        </select>
                    </div>

                    <div class="form-group two-column">
                        <div>
                            <label for="aisle">Aisle</label>
                            <input type="text" id="aisle" placeholder="e.g., 12" required>
                        </div>
                        <div id="section-field-single">
                            <label for="section">Section</label>
                            <input type="text" id="section" placeholder="e.g., 101" required>
                        </div>
                    </div>

                    <div class="form-group two-column" id="section-field-range" style="display: none;">
                        <div>
                            <label for="start-section">Start Section</label>
                            <input type="text" id="start-section" placeholder="e.g., 101">
                        </div>
                        <div>
                            <label for="end-section">End Section</label>
                            <input type="text" id="end-section" placeholder="e.g., 104">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="item-name">Item/Product Name <span style="color: #999; font-size: 0.9rem;">(optional)</span></label>
                        <input type="text" id="item-name" placeholder="e.g., Organic Milk 2%">
                    </div>

                    <div class="form-group">
                        <label>Just 4 U Issue <span style="color: #999; font-size: 0.9rem;">(optional)</span></label>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="just4u-yes" name="just4u" value="yes">
                                <label for="just4u-yes">Yes</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="just4u-no" name="just4u" value="no" checked>
                                <label for="just4u-no">No</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description" id="description-label">Description <span style="color: #999; font-size: 0.9rem;">(optional)</span></label>
                        <textarea id="description" placeholder="Additional details..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="reporter-name">Your Name <span style="color: #999; font-size: 0.9rem;">(optional)</span></label>
                        <input type="text" id="reporter-name" placeholder="e.g., John Doe">
                    </div>

                    <div class="form-group">
                        <label for="task-image">Attach Photo <span style="color: #999; font-size: 0.9rem;">(optional)</span></label>
                        <input type="file" id="task-image" accept="image/*" style="padding: 8px; background: white;">
                    </div>

                    <button type="submit" class="btn btn-primary">Submit Report</button>
                </form>
            </div>

            <div class="card">
                <h2>📋 Active Tasks</h2>
                
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="new-item">New Items</button>
                    <button class="filter-btn" data-filter="missing-price">Missing Price Tags</button>
                    <button class="filter-btn" data-filter="audit">Audits</button>
                    <button class="filter-btn" data-filter="subscription">Subscriptions</button>
                </div>

                <div class="task-list" id="task-list">
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                        </svg>
                        <p>No tasks found. Submit a new report to get started!</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="total-tasks">0</div>
                <div class="stat-label">Total Active Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="new-items-count">0</div>
                <div class="stat-label">New Items</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="missing-price-count">0</div>
                <div class="stat-label">Missing Price Tags</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="audits-count">0</div>
                <div class="stat-label">Audits</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="subscriptions-count">0</div>
                <div class="stat-label">Subscriptions</div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE_URL = window.location.origin;
        
        // Task storage
        let tasks = [];
        let currentFilter = 'all';

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            loadTasks();
            setupEventListeners();
        });

        // Load tasks from server
        async function loadTasks() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/tasks`);
                if (!response.ok) throw new Error('Failed to load tasks');
                tasks = await response.json();
                renderTasks();
                updateStats();
            } catch (error) {
                console.error('Error loading tasks:', error);
                alert('Failed to load tasks. Please refresh the page.');
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            // Form submission
            document.getElementById('task-form').addEventListener('submit', handleFormSubmit);

            // Task type change
            document.getElementById('task-type').addEventListener('change', function() {
                const isSubscription = this.value === 'subscription';
                const singleField = document.getElementById('section-field-single');
                const rangeField = document.getElementById('section-field-range');
                const descLabel = document.getElementById('description-label');
                const descField = document.getElementById('description');
                
                if (isSubscription) {
                    singleField.style.display = 'none';
                    rangeField.style.display = 'grid';
                    document.getElementById('section').removeAttribute('required');
                    document.getElementById('start-section').setAttribute('required', 'required');
                    document.getElementById('end-section').setAttribute('required', 'required');
                    descLabel.innerHTML = 'Schematic Description <span style="color: #999; font-size: 0.9rem;">(optional)</span>';
                    descField.placeholder = 'Describe the schematic that needs to be subscribed...';
                } else {
                    singleField.style.display = 'block';
                    rangeField.style.display = 'none';
                    document.getElementById('section').setAttribute('required', 'required');
                    document.getElementById('start-section').removeAttribute('required');
                    document.getElementById('end-section').removeAttribute('required');
                    descLabel.innerHTML = 'Description <span style="color: #999; font-size: 0.9rem;">(optional)</span>';
                    descField.placeholder = 'Additional details...';
                }
            });

            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderTasks();
                });
            });
        }

        // Handle form submission
        async function handleFormSubmit(e) {
            e.preventDefault();

            const just4uRadio = document.querySelector('input[name="just4u"]:checked');
            const taskType = document.getElementById('task-type').value;
            const aisle = document.getElementById('aisle').value;
            const imageInput = document.getElementById('task-image');
            
            let section, startSection, endSection;
            
            if (taskType === 'subscription') {
                startSection = document.getElementById('start-section').value;
                endSection = document.getElementById('end-section').value;
                section = `${startSection}-${endSection}`;
            } else {
                section = document.getElementById('section').value;
                startSection = null;
                endSection = null;
            }
            
            const formData = new FormData();
            formData.append('type', taskType);
            formData.append('aisle', aisle);
            formData.append('section', section);
            formData.append('startSection', startSection || '');
            formData.append('endSection', endSection || '');
            formData.append('itemName', document.getElementById('item-name').value || 'N/A');
            formData.append('description', document.getElementById('description').value || 'No description provided');
            formData.append('reporterName', document.getElementById('reporter-name').value || 'Anonymous');
            formData.append('just4u', just4uRadio ? just4uRadio.value === 'yes' : false);
            
            if (imageInput.files.length > 0) {
                formData.append('image', imageInput.files[0]);
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/tasks`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Failed to create task');
                
                // Reload tasks from server
                await loadTasks();

                // Reset form
                e.target.reset();
                document.getElementById('just4u-no').checked = true;
                document.getElementById('section-field-single').style.display = 'block';
                document.getElementById('section-field-range').style.display = 'none';
                document.getElementById('section').setAttribute('required', 'required');
                document.getElementById('start-section').removeAttribute('required');
                document.getElementById('end-section').removeAttribute('required');

                alert('Task submitted successfully!');
            } catch (error) {
                console.error('Error creating task:', error);
                alert('Failed to submit task. Please try again.');
            }
        }

        // Render tasks
        function renderTasks() {
            const taskList = document.getElementById('task-list');
            const filteredTasks = tasks.filter(task => {
                if (currentFilter === 'all') return true;
                return task.type === currentFilter;
            });

            if (filteredTasks.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                        </svg>
                        <p>No tasks found for this filter.</p>
                    </div>
                `;
                return;
            }

            taskList.innerHTML = filteredTasks.map(task => {
                const daysRemaining = getDaysRemaining(task.createdAt);
                const isWarning = daysRemaining <= 3;
                const just4uBadge = task.just4u ? '<span class="just4u-badge">J4U</span>' : '';
                const just4uText = task.just4u ? '<br><strong>Just 4 U Issue:</strong> Yes' : '';
                const imageHTML = task.imageUrl ? `<div class="image-preview"><img src="${task.imageUrl}" alt="Task image" class="task-image" onclick="window.open('${task.imageUrl}', '_blank')"></div>` : '';
                
                return `
                    <div class="task-item ${task.type}">
                        <div class="task-header">
                            <div class="task-title">${task.itemName}${just4uBadge}</div>
                            <div class="task-type type-${task.type}">${getTypeLabel(task.type)}</div>
                        </div>
                        <div class="task-details">
                            <strong>Aisle:</strong> ${task.aisle} | <strong>Section:</strong> ${task.section}<br>
                            <strong>Description:</strong> ${task.description}${just4uText}<br>
                            <strong>Reported by:</strong> ${task.reporterName}
                        </div>
                        ${imageHTML}
                        <div class="task-meta">
                            <span>
                                Created: ${formatDate(task.createdAt)} | 
                                <span class="days-remaining ${isWarning ? 'days-warning' : ''}">
                                    ${daysRemaining} days remaining
                                </span>
                            </span>
                            <div class="task-actions">
                                <button class="task-btn btn-complete" onclick="window.completeTask(${task.id})">
                                    ✓ Complete
                                </button>
                                <button class="task-btn btn-delete" onclick="window.deleteTask(${task.id})">
                                    × Delete
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Complete task
        window.completeTask = async function(id) {
            if (confirm('Mark this task as complete?')) {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/tasks/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if (!response.ok) throw new Error('Failed to delete task');
                    
                    await loadTasks();
                } catch (error) {
                    console.error('Error completing task:', error);
                    alert('Failed to complete task. Please try again.');
                }
            }
        };

        // Delete task
        window.deleteTask = async function(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/tasks/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if (!response.ok) throw new Error('Failed to delete task');
                    
                    await loadTasks();
                } catch (error) {
                    console.error('Error deleting task:', error);
                    alert('Failed to delete task. Please try again.');
                }
            }
        };

        // Calculate days remaining
        function getDaysRemaining(createdAt) {
            const created = new Date(createdAt);
            const expiryDate = new Date(created);
            expiryDate.setDate(expiryDate.getDate() + 14);
            
            const now = new Date();
            const diffTime = expiryDate - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            return Math.max(0, diffDays);
        }

        // Update statistics
        function updateStats() {
            document.getElementById('total-tasks').textContent = tasks.length;
            document.getElementById('new-items-count').textContent = 
                tasks.filter(t => t.type === 'new-item').length;
            document.getElementById('missing-price-count').textContent = 
                tasks.filter(t => t.type === 'missing-price').length;
            document.getElementById('audits-count').textContent = 
                tasks.filter(t => t.type === 'audit').length;
            document.getElementById('subscriptions-count').textContent = 
                tasks.filter(t => t.type === 'subscription').length;
        }

        // Helper functions
        function getTypeLabel(type) {
            const labels = {
                'new-item': 'New Item',
                'missing-price': 'Missing Price',
                'audit': 'Audit',
                'subscription': 'Subscription Required'
            };
            return labels[type] || type;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
    </script>
</body>
</html>
